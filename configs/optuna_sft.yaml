# ============================================================================
# Optuna search space สำหรับ SFT — คู่กับ src/hpo_optuna_sft.py
#
# ต่างจาก configs/optuna.yaml (สำหรับ CPT) ตรงที่:
#   - ไม่ค้น lora_r/alpha เพราะ SFT ต่อยอดจาก adapter ของ CPT ที่ rank ล็อกไว้ที่ 32 แล้ว
#     (เปลี่ยน rank กลางคันไม่ได้ ถ้าอยากค้น rank ต้องรันแบบ --no-init-adapter แยกต่างหาก)
#   - ไม่มี forgetting_penalty เพราะ SFT ไม่ได้เสี่ยง catastrophic forgetting แบบเดียวกับ CPT
#     (สอนพฤติกรรม ไม่ได้เขียนทับความรู้โดเมนทั้งก้อน) objective จึงเป็น eval_loss ตรง ๆ
#   - learning_rate เป็นตัวหลักที่ค้น เพราะเป็นคำถามที่ต้องการคำตอบ (ระหว่างเลือก 1e-4 เอง
#     รอบแรกแล้วเทรนด์ไม่ขยับ จึงกลับมาค้นอย่างเป็นระบบแทนการเดา)
# ============================================================================
optuna:
  study_name: typhoon7b-sft
  n_trials: 15
  n_startup_trials: 5
  pruner_warmup_evals: 2

  # แต่ละ trial สั้น ๆ บน subset — 15 trials × ~80 step ควรจบใน 1-2 ชม.
  max_steps_per_trial: 80
  subset_ratio: 0.15

  search_space:
    learning_rate:
      type: float
      low: 1.0e-5
      high: 3.0e-4
      log: true

    warmup_ratio:
      type: float
      low: 0.01
      high: 0.10

    weight_decay:
      type: float
      low: 0.0
      high: 0.10
