# ============================================================================
# CPT config — typhoon-7b บน RTX 4060 Laptop 8GB
# ค่าทุกตัวมีเหตุผลกำกับ อ่านคู่กับ docs/05_TRAINING_CPT.md
# ============================================================================
seed: 42

model:
  name: typhoon-ai/typhoon-7b     # base model (ไม่ใช่ instruct) — Mistral-7B arch, vocab 35,219
  cache_dir: null                  # ใส่ path ถ้าอยากเก็บ weight ไว้ที่อื่น (ไฟล์ ~15GB)

paths:
  book_dir: book
  raw_dir: data/raw
  processed_dir: data/processed
  replay_dir: data/replay
  output_dir: outputs

# ---------------------------------------------------------------------------
# ทำความสะอาดข้อความ
# ---------------------------------------------------------------------------
clean:
  min_chars: 800          # ต่ำกว่านี้ = เศษไฟล์ ไม่คุ้มที่จะเทรน
  min_thai_ratio: 0.60    # กันเอกสารที่หลุดเป็นภาษาอังกฤษล้วน
  keep_heading: true      # เก็บชื่อบทเป็นข้อความธรรมดา (เป็น boundary signal ที่ดี)

# ---------------------------------------------------------------------------
# ตัดข้อมูลซ้ำ
# ---------------------------------------------------------------------------
dedup:
  ngram: 5                # character 5-gram (ไทยไม่มีเว้นวรรค จึงไม่ใช้ word n-gram)
  num_perm: 128           # ความละเอียด MinHash — 128 คือจุดสมดุล speed/accuracy
  jaccard_threshold: 0.85 # >0.85 ถือว่าซ้ำ  (ถ้าใช้ augment ให้ตั้ง 0.90 ไม่งั้นตัด augment ทิ้งหมด)

# ---------------------------------------------------------------------------
# ข้อมูล
# ---------------------------------------------------------------------------
data:
  seq_len: 1024           # 8GB VRAM: 1024 ปลอดภัย | 2048 ต้องลด lora_r เหลือ 16
  val_ratio: 0.06         # แบ่งระดับ "เอกสาร" ไม่ใช่ระดับบล็อก (กัน leakage)
  replay_ratio: 0.15      # ผสมข้อความไทยทั่วไป 15% กัน catastrophic forgetting
                          # 0 = ปิด | 0.10-0.20 = ช่วงที่แนะนำ | >0.30 = โดเมนใหม่เรียนไม่เข้า

# ---------------------------------------------------------------------------
# การเทรน (ค่าที่ไม่ได้อยู่ใน search space ของ Optuna)
# ---------------------------------------------------------------------------
train:
  micro_batch_size: 1     # 8GB บังคับ — เพิ่ม effective batch ผ่าน grad_accum แทน
  epochs: 3               # corpus เล็ก จึงวนหลายรอบได้ แต่เกิน 4 มักเริ่ม overfit
  eval_steps: 50
  logging_steps: 10
  save_steps: 100

# ---------------------------------------------------------------------------
# Hyperparameter เริ่มต้น (ใช้เมื่อยังไม่ได้รัน Optuna)
# ค่าเหล่านี้คือจุดตั้งต้นที่ปลอดภัย ไม่ใช่ค่าที่ดีที่สุด
# ---------------------------------------------------------------------------
hp:
  learning_rate: 1.0e-4   # LoRA-CPT อยู่ช่วง 5e-5 ~ 3e-4 (สูงกว่า full-FT 10 เท่า เพราะปรับพารามิเตอร์น้อย)
  lora_r: 32              # CPT ต้องการ rank สูงกว่า SFT — ความรู้ใหม่ต้องการ capacity
  lora_alpha: 64          # = 2×r (ใช้ rsLoRA จึง scale เป็น alpha/sqrt(r) อัตโนมัติ)
  lora_dropout: 0.05
  grad_accum: 16          # effective batch = 1×16×1024 = 16,384 token/step
  lr_scheduler: cosine
  warmup_ratio: 0.03
  weight_decay: 0.01
  max_grad_norm: 0.5      # ต่ำกว่า default 1.0 — CPT ช่วงแรก gradient แกว่งแรง
  use_rslora: true
