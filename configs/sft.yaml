# ============================================================================
# SFT (Supervised Fine-Tuning) — สอนให้ตอบคำถาม ต่อจาก CPT ที่สอนความรู้โดเมน
#
# เหตุผลของทุกค่าที่ต่างจาก CPT (configs/cpt_large_v3.yaml):
#
#   learning_rate 1e-4 (CPT ใช้ 2e-5, สูงขึ้น 5 เท่า)
#     SFT สอน "พฤติกรรมการตอบ" ซึ่งเป็นการเปลี่ยนที่ผิวกว่าการฝังความรู้ จึงรับ lr
#     สูงกว่าได้และต้องการด้วยเพื่อให้ format เปลี่ยนทัน — งานอ้างอิงใช้ 2e-4 (QLoRA paper)
#     ถึง 3e-4 (Alpaca-LoRA) สำหรับ 7B แต่โปรเจกต์นี้พิสูจน์แล้วว่าไวต่อ lr สูงผิดปกติ
#     (8e-5 ทำ CPT พังใน RESULTS.md §11) จึงเลือก 1e-4 ซึ่งต่ำกว่าค่ามาตรฐานไว้ก่อน
#
#   lora_r 16 / alpha 32 (CPT ใช้ 32/64)
#     capacity ที่ต้องใช้จำ "รูปแบบการตอบ" น้อยกว่าที่ใช้จำ "เนื้อหา" มาก
#     r ต่ำลงยังลดความเสี่ยง overfit และประหยัด VRAM ให้ seq ยาวขึ้นได้
#     *ค่านี้ใช้เฉพาะตอน --no-init-adapter* — โดยดีฟอลต์เราต่อจาก adapter ของ CPT
#     ซึ่ง rank ถูกล็อกไว้ที่ 32 ตั้งแต่ตอน CPT แล้ว เปลี่ยนกลางคันไม่ได้
#
#   epochs 2 (CPT v3 ตั้ง 15 แล้ว overfit ตั้งแต่ epoch 2)
#     คลัง SFT (8.2M token) ใหญ่กว่าคลัง CPT (1.79M) ราว 4.6 เท่า ความเสี่ยง overfit
#     จึงต่ำกว่ามาก แต่บทเรียนจาก §13 ชัดว่าอย่าตั้งเผื่อเยอะ — 2 epoch คือค่ามาตรฐาน
#     ของ SFT อยู่แล้ว และมี load_best_model_at_end คอยเลือก checkpoint ที่ดีที่สุดให้
#
#   max_len 1024 (เท่า CPT)
#     วัดจากข้อมูลจริง: p50=306, p90=508, p99=887 token ต่อคู่ Q&A
#     1024 ครอบคลุมเต็ม 99.5% ของคู่ทั้งหมด และเป็นค่าที่รู้พฤติกรรม VRAM แน่นอนแล้ว
#     (ที่ 2048 จะครอบคลุม 100% แต่แลกกับ VRAM ที่ตึงอยู่แล้วบนการ์ด 8GB)
#     หมายเหตุ: ใช้ dynamic padding ใน train_sft.py จึงไม่ได้เสีย compute กับ pad เต็ม 1024
#
#   grad_accum 8 → effective batch 8 คู่/step (เท่า CPT)
#     ให้ step time ใกล้เคียงของเดิม (~38s) จะได้ประเมินเวลาที่เหลือได้จากประสบการณ์ตรง
#
#   eval/save ทุก 100 step (CPT ใช้ 50)
#     ข้อมูลใหญ่กว่า → step/epoch เยอะกว่า (2,690 vs 218) ถ้า eval ทุก 50 จะเสียเวลา
#     ไปกับ eval มากเกินไป 100 ให้จุดข้อมูลราว 27 จุดต่อ epoch ซึ่งพอจับ overfit ทัน
# ============================================================================
seed: 42

model:
  name: typhoon-ai/typhoon-7b
  cache_dir: null
  # ต่อยอดจาก adapter ที่ผ่าน CPT มาแล้ว (RESULTS.md §13, domain PPL -15.7%)
  # เพื่อไม่ทิ้งความรู้โดเมนที่อุตส่าห์เทรนมา — ใช้ --no-init-adapter ถ้าอยากเริ่มใหม่
  init_adapter: outputs_large_v3/run1/checkpoint-200

paths:
  sft_dir: data/sft
  output_dir: outputs_sft

data:
  max_len: 1024

train:
  micro_batch_size: 1
  epochs: 2
  eval_steps: 100
  logging_steps: 25
  save_steps: 100

hp:
  learning_rate: 1.0e-4
  lora_r: 16              # ใช้เฉพาะกรณี --no-init-adapter (ดูคอมเมนต์หัวไฟล์)
  lora_alpha: 32
  lora_dropout: 0.05
  grad_accum: 8
  lr_scheduler: cosine
  warmup_ratio: 0.03
  weight_decay: 0.01
  max_grad_norm: 1.0
  use_rslora: true
